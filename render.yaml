# Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy with:
#   1. Push this repo to GitHub.
#   2. In Render dashboard: New -> Blueprint -> connect your repo.
#   3. Render reads this file and provisions all 4 services.
#
# After first deploy, generate secrets:
#   node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
# then fill them in the Render dashboard for the api service.

services:
  # ---------- PostgreSQL ----------
  - type: pserv
    name: broker-db
    plan: starter              # $7/mo, 1GB, no 90-day expiry
    region: oregon
    databaseName: broker
    databaseUser: broker
    ipAllowList: []            # only accessible from Render services
    # Auto-injected env: DATABASE_URL (with internal hostname)

  # ---------- Redis ----------
  # Render Key-Value (Redis-compatible) instance.
  - type: redis
    name: broker-redis
    plan: starter              # $10/mo, 1GB
    region: oregon
    # Auto-injected env: REDIS_URL

  # ---------- API (Node + Express + Prisma) ----------
  - type: web
    name: broker-api
    plan: starter              # $7/mo, never sleeps, custom domain OK
    region: oregon
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: broker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: broker-redis
          property: connectionString
      # --- Secrets: fill these in the Render dashboard after first deploy ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true       # 64 hex chars (32 bytes)
      # --- Owner bootstrap ---
      - key: OWNER_EMAIL
        sync: false               # you'll fill this in dashboard
      - key: OWNER_PASSWORD
        sync: false
      # --- Plans ---
      - key: PLAN_NORMAL_MIN
        value: "100"
      - key: PLAN_PRO_MIN
        value: "1000"
      - key: SPLIT_NORMAL
        value: "0.7"
      - key: SPLIT_PRO
        value: "0.8"
      - key: MIN_INVEST_DAYS
        value: "3"
      # --- EA HMAC secrets (one per EA) ---
      - key: EA_HMAC_SECRET_PRO
        generateValue: true
      - key: EA_HMAC_SECRET_SIGNAL
        generateValue: true
      - key: API_BASE_URL
        fromService:
          type: web
          name: broker-api
          property: hostUrl
      - key: USDT_TRC20_ADDRESS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  # ---------- Web (Next.js) ----------
  - type: web
    name: broker-web
    plan: starter
    region: oregon
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: broker-api
          property: hostUrl
