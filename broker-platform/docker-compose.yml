services:
  db:
    image: postgres:15
    container_name: broker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    volumes:
      - broker_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - broker_net

  redis:
    image: redis:7
    container_name: broker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - broker_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: broker_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://broker:broker@db:5432/broker?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      PLAN_NORMAL_MIN: ${PLAN_NORMAL_MIN:-100}
      PLAN_PRO_MIN: ${PLAN_PRO_MIN:-1000}
      SPLIT_NORMAL: ${SPLIT_NORMAL:-0.7}
      SPLIT_PRO: ${SPLIT_PRO:-0.8}
      MIN_INVEST_DAYS: ${MIN_INVEST_DAYS:-3}
      EA_HMAC_SECRET_PRO: ${EA_HMAC_SECRET_PRO}
      EA_HMAC_SECRET_SIGNAL: ${EA_HMAC_SECRET_SIGNAL}
      USDT_TRC20_ADDRESS: ${USDT_TRC20_ADDRESS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - broker_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    container_name: broker_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    networks:
      - broker_net

volumes:
  broker_pgdata:

networks:
  broker_net:
    driver: bridge
